
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieVault</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">MV</div>
        <h1>MovieVault</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#add-movie">Add Movie</a>
            <a href="#watchlist">My Movies</a>
        </nav>
    </header>

    <main>

        <!-- Home section -->
        <section id="home" class="hero">
            <h2>Welcome to MovieVault</h2>
            <p>Keep track of movies you want to watch and movies you have already watched.</p>
            <a href="#add-movie" class="button">Add a Movie</a>
        </section>

        <!-- Movie form -->
        <section id="add-movie" class="box">
            <h2>Add a Movie</h2>

            <form id="movie-form">

                <label for="title">Movie Title</label>
                <input type="text" id="title" required>

                <label for="genre">Genre</label>
                <select id="genre" required>
                    <option value="">Select Genre</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Other">Other</option>
                </select>

                <label for="year">Release Year</label>
                <input type="number" id="year" min="1888" max="2100" required>

                <label for="status">Watch Status</label>
                <select id="status" required>
                    <option value="">Select Status</option>
                    <option value="Plan to Watch">Plan to Watch</option>
                    <option value="Watched">Watched</option>
                </select>

                <button type="submit">Save Movie</button>

            </form>
        </section>

        <!-- Movie list -->
        <section id="watchlist" class="box">
            <h2>My Movie Watchlist</h2>

            <p>Total Movies: <span id="movie-count">0</span></p>

            <p id="empty-message"></p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Movie Title</th>
                            <th>Genre</th>
                            <th>Year</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="movie-list">
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>MovieVault - INFR3120 Fall 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
